<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DataShield Dashboard</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="popup-body">
    <header class="header">
      <h1>🛡 DataShield</h1>
      <label class="switch" aria-label="Enable DataShield">
        <input type="checkbox" id="toggle-shield" checked>
        <span class="slider"></span>
      </label>
    </header>
    <p class="subtitle">Sensitive data flow monitor</p>
    <section class="settings" aria-label="Privacy controls">
      <label>Trusted domains <textarea id="allowlist" placeholder="example.com, api.example.com"></textarea></label>
      <label>Blocked domains <textarea id="blocked-domains" placeholder="tracker.example"></textarea></label>
      <label>Custom regex patterns <textarea id="custom-patterns" placeholder="employee-[0-9]{6} (one per line)"></textarea></label>
      <div class="settings-row"><label>Keep history <select id="retention-days"><option value="1">1 day</option><option value="7">7 days</option><option value="30">30 days</option><option value="90">90 days</option></select></label><button id="save-settings" type="button">Save controls</button></div>
      <fieldset><legend>Detect</legend><label><input data-detector="creditCard" type="checkbox"> Cards</label><label><input data-detector="email" type="checkbox"> Email</label><label><input data-detector="ssn" type="checkbox"> SSN</label><label><input data-detector="apiKey" type="checkbox"> API keys</label><label><input data-detector="phone" type="checkbox"> Phone</label></fieldset>
    </section>
    <hr>
    <h2>Recent data travel</h2>
    <main id="flow-container" aria-live="polite"></main>
    <footer class="actions"><button id="export-json" type="button">Export JSON</button><button id="export-csv" type="button">Export CSV</button><button id="clear-logs" type="button">Clear history</button></footer>
    <script src="popup.js"></script>
  </body>
</html>
